<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FEF3001 assignments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,500;87.5,700&family=Spectral:wght@400&display=swap" rel="stylesheet">
<style>
:root{--paper:#ffffff;--ink:#16181d;--graphite:#5a6070;--red:#c4262e;--grid:#e3e5ea}
body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.62 'Spectral',Georgia,serif}
main{max-width:46em;margin:0 auto;padding:56px 20px 80px}
h1{font:700 clamp(34px,5vw,52px)/1 'Archivo','Arial Narrow',sans-serif;font-stretch:87.5%;margin:0 0 .3em}
p{margin:0 0 1.6em;color:var(--graphite)}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--grid)}
li{padding:20px 0;border-bottom:1px solid var(--grid)}
li a{font:700 24px/1.2 'Archivo','Arial Narrow',sans-serif;font-stretch:87.5%;color:var(--ink);text-decoration:none}
li a:hover{color:var(--red)}
li span{display:block;margin-top:4px;color:var(--graphite)}
a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
sub{font-size:.55em;line-height:0;vertical-align:-.12em}
footer{margin-top:40px;font-size:16px;color:var(--graphite)}
</style>
</head>
<body>
<main>
  <h1>FEF3001 assignments</h1>
  <p>Introduction to Artificial Intelligence, Yıldız Technical University, fall 2026.</p>
  <ol>
    <li><a href="a1/">Assignment 1: Is the rise of CO<sub>2</sub> accelerating?</a>
      <span>Google Antigravity and Google Colab. Handed out 5 November, due 12 November 2026 at 14:00.</span></li>
  </ol>
  <footer>Prof. Dr. Bora Işıldak</footer>
</main>
</body>
</html>
