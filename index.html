<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FEF3001 Assignments</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1c2233;--soft:#4b5366;--rule:#dcd8cc;--brand:#222b57;--gold:#a8884f}
@media (prefers-color-scheme:dark){:root{--bg:#0f131d;--panel:#161c2a;--ink:#e8eaf0;--soft:#b4bacb;--rule:#2b3245;--brand:#9fb0e8;--gold:#cdb482}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
.kicker{font:600 13px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:.3em 0 .6em}
a.item{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--gold);border-radius:6px;padding:14px 16px;margin:12px 0}
a.item b{color:var(--brand);font-size:18px} a.item span{display:block;color:var(--soft);font-size:15px}
footer{margin-top:40px;font-size:14px;color:var(--soft)}
</style>
</head>

<main>
  <div class="kicker">FEF3001 · Introduction to Artificial Intelligence · Fall 2026</div>
  <h1>Assignments</h1>
